<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Superhero Exercise</title>
    <style>
      body {
        align-items: center;
        background: #f6f7fb;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
    <script>
      const exercises = {
        "ColorGame.js": "ColorGame.js",
        "Crushthevillian.js": "Crushthevillian.js"
      };
      const requestedExercise = new URLSearchParams(window.location.search).get("sketch");
      const exerciseFile = exercises[requestedExercise];
      const difficulty = new URLSearchParams(window.location.search).get("difficulty");

      if (exerciseFile) {
        window.exerciseDifficulty = ["Easy", "Normal", "Hard"].includes(difficulty)
          ? difficulty
          : "Normal";
        const script = document.createElement("script");
        script.src = "./" + exerciseFile;
        document.body.appendChild(script);
      } else {
        document.body.textContent = "Exercise not found.";
      }
    </script>
  </body>
</html>
